name: Bootstrap Echelon Engineering Capabilities

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-ece-capabilities.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install current engineering capabilities
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros init             --profile greenfield             --project "Echelon Sales and Marketing"
          npx --yes @echelon-foundry/sde@1.3.0 init
          npx --yes @echelon-foundry/visual-engineering@1.0.0 init
          npm exec --yes             --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122             communication-engineering -- init
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 init

      - name: Verify installed capabilities
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros verify
          npx --yes @echelon-foundry/sde@1.3.0 verify
          npx --yes @echelon-foundry/visual-engineering@1.0.0 verify
          npm exec --yes             --package=github:kemiller2002/communication-engineering#4590d2fe6f7e80b339117d3fbee5803f2dd39122             communication-engineering -- verify --strict
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 verify --strict

      - name: Commit bootstrap except generated workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/ros-validation.yml .github/workflows/limen-verify.yml || true
          if git diff --cached --quiet; then
            echo "No bootstrap changes"
            exit 0
          fi
          git commit -m "Bootstrap Echelon engineering capabilities"
          git pull --rebase origin main
          git push
